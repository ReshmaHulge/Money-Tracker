
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Expense Analysis Report</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- Google Font -->
    <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">

    <!-- Main CSS -->
    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">

    <style>

        body {
            background: linear-gradient(135deg,#667eea,#764ba2);
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
        }

        .container-box {
            margin-top: 30px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .title {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }

        .main-card {
            background: white;
            color: #333;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .expense-card {
            background: linear-gradient(135deg,#ff758c,#ff7eb3);
            color: white;
            border-radius: 20px;
            padding: 25px;
            text-align: center;
        }

        .expense-card i {
            font-size: 40px;
            margin-bottom: 15px;
        }

        .category-card {
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            background: #f8f9fa;
            color: #333;
        }

        .progress {
            height: 12px;
            border-radius: 10px;
        }

        .btn-dashboard {
            margin-top: 25px;
        }

        /* Dark Mode */

        body.dark-mode {
            background: linear-gradient(135deg,#141e30,#243b55);
            color: white;
        }

        body.dark-mode .main-card {
            background: #1e293b;
            color: white;
        }

        body.dark-mode .category-card {
            background: #334155;
            color: white;
        }

        body.dark-mode .category-card h5,
        body.dark-mode .category-card strong,
        body.dark-mode .main-card h3 {
            color: white;
        }

        body.dark-mode .progress {
            background: #475569;
        }

    </style>

</head>

<body>

    <div class="container container-box">

        <!-- Topbar -->
        <div class="topbar">

            <h4 style="color:white;">
                Money Tracker
            </h4>

            <div class="profile">

                <button type="button" id="themeToggle" class="theme-toggle">
                    <i class="fa-solid fa-moon"></i>
                    <span>Dark Mode</span>
                </button>

            </div>

        </div>

        <h1 class="title">
            <i class="fa-solid fa-chart-pie"></i>
            Expense Analysis Report
        </h1>

        <div class="main-card">

            <!-- Total Expense -->
            <div class="expense-card mb-4">

                <i class="fa-solid fa-wallet"></i>

                <h3>Total Expense</h3>

                <h1>
                    ₹ {{ total_expense }}
                </h1>

            </div>

            <h3 class="mb-4">
                <i class="fa-solid fa-list"></i>
                Category Wise Expense
            </h3>

            {% for key,value in category.items() %}

            <div class="category-card">

                <div class="d-flex justify-content-between">

                    <h5>
                        {{ key }}
                    </h5>

                    <strong>
                        ₹ {{ value }}
                    </strong>

                </div>

                <div class="progress mt-2">

                    <div class="progress-bar"
                    role="progressbar"
                    style="width: {{ ((value / total_expense * 100)|round) if total_expense else 0 }}%">

                    </div>

                </div>

            </div>

            {% endfor %}

            <div class="text-center">

                <a href="/"
                class="btn btn-primary btn-dashboard">

                    <i class="fa-solid fa-house"></i>
                    Back To Dashboard

                </a>

            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
